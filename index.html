<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>家庭课程学习管理</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#e6eaf1;--blue:#356ae6;--green:#16845b;--orange:#b86a12;--red:#c43d43;--shadow:0 5px 20px rgba(24,39,75,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#fff,#f1f5ff);border-bottom:1px solid var(--line);padding:18px max(16px,calc((100vw - 1100px)/2));position:sticky;top:0;z-index:5}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:750}.sub{font-size:12px;color:var(--muted)}
main{max-width:1100px;margin:18px auto;padding:0 14px 90px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid #dce2ec;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);width:100%;min-width:0}textarea{min-height:76px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:650;cursor:pointer}button.secondary{background:#edf1f8;color:#27344c}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:7px 10px;font-size:13px}button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px;scrollbar-width:thin}.tabs button{white-space:nowrap;background:#e9edf5;color:#3c4960}.tabs button.active{background:var(--blue);color:white}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{font-size:25px;display:block;margin-top:3px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.section-title{font-size:17px;font-weight:750;margin:5px 0 12px}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2f8;color:#536078;font-size:12px}.pill.good{background:#e8f7ef;color:var(--green)}.pill.warn{background:#fff4e5;color:var(--orange)}.pill.bad{background:#fff0f0;color:var(--red)}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.item h3{margin:0 0 5px;font-size:15px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d8deea;border-radius:12px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:#566176;font-weight:650}.field.full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted)}.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:650}
dialog{border:0;border-radius:18px;padding:0;width:min(620px,calc(100% - 24px));max-height:88vh;box-shadow:0 20px 70px #17203344}dialog::backdrop{background:#10182888}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:16px 18px;overflow:auto;max-height:70vh}.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;box-shadow:var(--shadow);max-width:90vw}
.notice{background:#fff8e9;border:1px solid #f3dfb7;padding:11px 13px;border-radius:12px;font-size:13px;color:#79521d}
.bottomnav{display:none}
@media(max-width:700px){header{padding:13px 14px}.brand{font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}main{margin:12px auto;padding:0 11px 100px}.card{padding:13px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:8}.bottomnav button{background:transparent;color:#526078;padding:6px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}.bottomnav button.active{color:var(--blue)}.bottomnav span{font-size:18px}}
@media(min-width:701px){.tabs{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="head"><div><div class="brand">📚 家庭课程学习管理</div><div class="sub">课程安排 · 学习档案 · 课时账户</div></div><div class="sub" id="version">V1.0.1 · 本地数据</div></div></header>
<main>
<div class="toolbar"><div style="min-width:180px;flex:1"><select id="childFilter" aria-label="选择孩子"><option value="all">全部孩子 · 家庭总览</option></select></div><button class="secondary small" id="quickAdd">＋ 快速新增</button></div>
<nav class="tabs" id="tabs">
<button data-tab="home" class="active">学习概览</button><button data-tab="children">孩子管理</button><button data-tab="courses">课程档案</button><button data-tab="schedule">课程安排</button><button data-tab="learning">学习档案</button><button data-tab="hours">课时管理</button><button data-tab="homework">作业管理</button><button data-tab="reminders">提醒中心</button><button data-tab="data">数据管理</button>
</nav>
<section id="view"></section>
</main>
<nav class="bottomnav" id="bottomnav">
<button data-tab="home" class="active"><span>⌂</span>概览</button><button data-tab="schedule"><span>▦</span>课程</button><button data-tab="learning"><span>▤</span>学习</button><button data-tab="hours"><span>◷</span>课时</button><button data-tab="data"><span>⚙</span>数据</button>
</nav>
<dialog id="dlg"><div class="modal-head"><b id="dlgTitle">新增</b><button class="secondary small" id="closeDlg">关闭</button></div><form id="dlgForm"><div class="modal-body" id="dlgBody"></div><div class="modal-foot"><button type="button" class="secondary" id="cancelDlg">取消</button><button type="submit">保存</button></div></form></dialog>
<div id="toast" class="toast hidden"></div>
<script>
(()=> {
'use strict';
const DB='family_learning_manager_v1', VERSION=1;
const stores=['children','courses','accounts','purchases','schedules','lessons','transactions','learning','knowledge','homework','reminders','settings'];
let db, currentTab='home', currentChild='all', modalSave=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const datePlus=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>'¥'+num(v).toFixed(2);
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{let d=r.result;stores.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{let t=db.transaction(store,'readonly'),r=t.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{let t;try{t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=()=>resolve(obj);t.onerror=()=>reject(t.error||new Error('本地数据写入失败'));t.onabort=()=>reject(t.error||new Error('保存事务已中止'))}catch(e){reject(e)}})}
function del(store,id){return new Promise((resolve,reject)=>{let t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function multiPut(entries){return new Promise((resolve,reject)=>{let t=db.transaction([...new Set(entries.map(x=>x[0]))],'readwrite');entries.forEach(([s,o])=>t.objectStore(s).put(o));t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function rows(s){return all(s)}
async function getById(s,id){return (await all(s)).find(x=>x.id===id)}
function childName(id){return state.children.find(x=>x.id===id)?.name||'未指定孩子'}
function courseName(id){return state.courses.find(x=>x.id===id)?.name||'已归档课程'}
function accountFor(courseId){return state.accounts.find(x=>x.courseId===courseId)}
let state={};
async function load(){for(let s of stores)state[s]=await all(s)}
async function expireBatches(){
 const expired=state.purchases.filter(p=>p.expiryDate&&p.expiryDate<today()&&num(p.remaining)>0);
 for(const p of expired){const a=accountFor(p.courseId);const amount=num(p.remaining);p.remaining=0;const entries=[['purchases',p]];if(a){const actual=Math.min(num(a.balance),amount);a.balance=num(a.balance)-actual;a.updatedAt=new Date().toISOString();entries.push(['accounts',a]);if(actual>0)entries.push(['transactions',{id:uid(),childId:p.childId,courseId:p.courseId,accountId:a.id,type:'expiry',change:-actual,sourceId:p.id,reason:'购买批次到期',date:today(),createdAt:new Date().toISOString()}]);}await multiPut(entries);}
 if(expired.length) await load();
}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2600)}
function filtered(list){return currentChild==='all'?list:list.filter(x=>x.childId===currentChild)}
function options(items,selected,placeholder='请选择'){return `<option value="">${placeholder}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function empty(msg='暂无记录'){return `<div class="empty">${msg}</div>`}
function card(title,body,extra=''){return `<div class="card"><div class="row"><div class="section-title">${title}</div>${extra}</div>${body}</div>`}
function childSelect(id=''){return `<select name="childId" required>${options(state.children.filter(x=>!x.archived),id)}</select>`}
function courseSelect(childId='',id=''){let list=state.courses.filter(x=>!x.archived&&(!childId||x.childId===childId));return `<select name="courseId" required>${options(list,id)}</select>`}
function refreshFilter(){let el=$('#childFilter');el.innerHTML='<option value="all">全部孩子 · 家庭总览</option>'+state.children.filter(x=>!x.archived).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');el.value=currentChild}
function setTab(tab){currentTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function render(){refreshFilter();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));let v=$('#view');let fn=views[currentTab]||views.home;v.innerHTML=fn();bindView()}
const views={
home(){let kids=filtered(state.children.filter(x=>!x.archived)),courses=filtered(state.courses.filter(x=>!x.archived)),sched=filtered(state.schedules.filter(x=>!x.archived&&x.status==='planned'&&x.date>=today())).sort((a,b)=>a.date.localeCompare(b.date)),hw=filtered(state.homework.filter(x=>!x.archived&&!['checked'].includes(x.status))),accounts=filtered(state.accounts);let low=accounts.filter(a=>num(a.balance)<=3);let due=state.purchases.filter(p=>p.expiryDate&&p.expiryDate>=today()&&p.expiryDate<=datePlus(30)&&num(p.remaining)>0);let overdue=hw.filter(h=>h.deadline&&h.deadline<today());return `<div class="grid"><div class="stat"><span class="muted">孩子</span><b>${kids.length}</b></div><div class="stat"><span class="muted">在读课程</span><b>${courses.length}</b></div><div class="stat"><span class="muted">待上课程</span><b>${sched.length}</b></div><div class="stat"><span class="muted">待处理作业</span><b>${hw.length}</b></div></div>
${card('需要关注',`<div class="list">${low.map(a=>`<div class="item"><b>${esc(childName(a.childId))} · ${esc(courseName(a.courseId))}</b><div class="muted">剩余 ${num(a.balance)} 课时，已达到低余额提醒阈值（3课时）</div></div>`).join('')}${due.map(p=>`<div class="item"><b>${esc(courseName(p.courseId))} · 购买批次即将到期</b><div class="muted">${esc(p.expiryDate)} 到期，剩余 ${num(p.remaining)} 课时</div></div>`).join('')}${overdue.map(h=>`<div class="item"><b>${esc(h.title)} · 作业逾期</b><div class="muted">${esc(h.deadline)}</div></div>`).join('')}${!low.length&&!due.length&&!overdue.length?'<div class="muted">目前没有触发的重点提醒。</div>':''}</div>`)}
${card('近期课程',sched.length?`<div class="list">${sched.slice(0,8).map(s=>`<div class="item"><div class="row"><b>${esc(childName(s.childId))} · ${esc(courseName(s.courseId))}</b><span class="pill">${esc(s.date)} ${esc(s.time||'')}</span></div><div class="muted">${esc(s.location||'地点未填写')} · 计划消耗 ${num(s.plannedHours)} 课时</div><div class="actions"><button class="small" data-action="complete" data-id="${s.id}">完成课程</button><button class="small secondary" data-action="editSchedule" data-id="${s.id}">编辑</button></div></div>`).join('')}</div>`:empty('暂无待上课程'))}
${card('快速操作',`<div class="actions"><button data-action="addChild">新增孩子</button><button class="secondary" data-action="addCourse">新增课程</button><button class="secondary" data-action="addSchedule">安排课程</button><button class="secondary" data-action="purchase">登记购买</button></div>`)}
<div class="notice">数据保存在当前浏览器。请定期进入「数据管理」导出 JSON 备份；清理浏览器数据或更换设备可能导致本地记录丢失。</div>`},
children(){let list=state.children.filter(x=>!x.archived);return `${card('孩子档案',`<div class="actions"><button data-action="addChild">＋ 新增孩子</button></div>`)}<div class="list">${list.map(c=>`<div class="item"><div class="row"><h3>${esc(c.name)}</h3><span class="pill">${c.status==='paused'?'暂停':'管理中'}</span></div><div class="muted">${c.birthday?'生日：'+esc(c.birthday):'未填写生日'} ${c.note?' · '+esc(c.note):''}</div><div class="actions"><button class="small secondary" data-action="editChild" data-id="${c.id}">编辑</button><button class="small danger" data-action="archive" data-type="children" data-id="${c.id}">归档</button></div></div>`).join('')||empty('请先新增孩子')}</div>`},
courses(){let list=filtered(state.courses.filter(x=>!x.archived));return `${card('课程档案',`<div class="actions"><button data-action="addCourse">＋ 新增课程</button></div>`)}<div class="list">${list.map(c=>{let a=accountFor(c.id);return `<div class="item"><div class="row"><h3>${esc(childName(c.childId))} · ${esc(c.name)}</h3><span class="pill">${c.status==='paused'?'暂停':c.status==='ended'?'结课':'在读'}</span></div><div class="muted">${esc(c.institution||'机构未填写')} · ${esc(c.teacher||'老师未填写')} · ${esc(c.location||'地点未填写')}</div><div class="row" style="margin-top:8px"><b>剩余 ${a?num(a.balance):0} 课时</b><span class="muted">每次默认 ${num(c.defaultHours)||1} 课时</span></div><div class="actions"><button class="small secondary" data-action="editCourse" data-id="${c.id}">编辑</button><button class="small" data-action="purchase" data-id="${c.id}">购买课时</button><button class="small secondary" data-action="addSchedule" data-id="${c.id}">安排课程</button><button class="small danger" data-action="archive" data-type="courses" data-id="${c.id}">归档</button></div></div>`}).join('')||empty('请先新增课程')}</div>`},
schedule(){let list=filtered(state.schedules.filter(x=>!x.archived)).sort((a,b)=>b.date.localeCompare(a.date));let rules=filtered(ruleList());return `${card('固定周期课程',`<div class="hint">每门课程单独设置固定上课日和时间，系统自动生成未来90天的课程；无需每周重复新增。</div><div class="actions"><button data-action="addWeeklyRule">＋ 设置固定上课规律</button><button class="secondary" data-action="addSchedule">单次新增 / 临时补课</button></div>`)}<div class="list">${rules.map(r=>`<div class="item"><div class="row"><b>${esc(childName(r.childId))} · ${esc(courseName(r.courseId))}</b><span class="pill good">每周重复</span></div><div class="muted">${(r.weekdays||[]).sort().map(d=>weekdayNames()[d]).join('、')} · ${esc(r.time)} · ${num(r.plannedHours)}课时</div><div class="muted">开始：${esc(r.startDate)}${r.endDate?' · 结束：'+esc(r.endDate):' · 长期有效'}${r.location?' · '+esc(r.location):''}</div><div class="actions"><button class="small secondary" data-action="editWeeklyRule" data-id="${r.id}">编辑规律</button><button class="small danger" data-action="disableWeeklyRule" data-id="${r.id}">停止重复生成</button></div></div>`).join('')||empty('尚未设置固定周期课程')}</div><div class="hint" style="margin:12px 2px">单次课程安排（包括由固定规律生成的每次课程）</div><div class="list">${list.map(s=>`<div class="item"><div class="row"><h3>${esc(childName(s.childId))} · ${esc(courseName(s.courseId))}</h3><span class="pill ${s.status==='completed'?'good':s.status==='planned'?'warn':''}">${statusText(s.status)}</span></div><div class="muted">${esc(s.date)} ${esc(s.time||'')} · ${num(s.plannedHours)}课时 · ${esc(s.location||'地点未填写')} ${s.ruleId?'· 固定规律生成':''}</div>${s.note?`<div>${esc(s.note)}</div>`:''}<div class="actions">${s.status==='planned'?`<button class="small" data-action="complete" data-id="${s.id}">完成并记录</button>`:''}<button class="small secondary" data-action="editSchedule" data-id="${s.id}">编辑本次</button>${s.status==='planned'?`<button class="small secondary" data-action="setStatus" data-status="leave" data-id="${s.id}">请假</button><button class="small secondary" data-action="setStatus" data-status="absent" data-id="${s.id}">缺课</button><button class="small secondary" data-action="setStatus" data-status="cancelled" data-id="${s.id}">取消</button>`:''}<button class="small danger" data-action="archive" data-type="schedules" data-id="${s.id}">归档</button></div></div>`).join('')||empty('暂无课程安排')}</div>`},
learning(){let list=filtered(state.learning).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `${card('学习档案',`<div class="actions"><button data-action="addLearning">＋ 新增学习记录</button></div><div class="hint">可从已完成课程创建，也可独立补录历史学习内容。</div>`)}<div class="list">${list.map(l=>`<div class="item"><div class="row"><h3>${esc(childName(l.childId))} · ${esc(courseName(l.courseId))}</h3><span class="pill">${esc(l.date||'')}</span></div><b>课程内容</b><div>${esc(l.content||'未填写')}</div>${l.feedback?`<div class="muted">老师反馈：${esc(l.feedback)}</div>`:''}${l.summary?`<div class="muted">阶段/家长备注：${esc(l.summary)}</div>`:''}${l.points?`<div class="muted">知识点：${esc(l.points)}</div>`:''}<div class="actions"><button class="small secondary" data-action="editLearning" data-id="${l.id}">编辑</button><button class="small danger" data-action="archive" data-type="learning" data-id="${l.id}">归档</button></div></div>`).join('')||empty('暂无学习记录')}</div>`},
hours(){let acc=filtered(state.accounts);return `${card('课时账户',`<div class="actions"><button data-action="purchase">＋ 登记购买课时</button><button class="secondary" data-action="adjust">人工调整</button></div><div class="hint">同一孩子同一课程统一累计；默认永久有效。限时批次单独记录有效期。</div>`)}<div class="list">${acc.map(a=>{let p=state.purchases.filter(x=>x.courseId===a.courseId);return `<div class="item"><div class="row"><h3>${esc(childName(a.childId))} · ${esc(courseName(a.courseId))}</h3><span class="pill ${num(a.balance)<=3?'warn':'good'}">剩余 ${num(a.balance)} 课时</span></div><div class="muted">累计购买 ${num(a.totalPurchased)} · 累计消耗 ${num(a.totalConsumed)} · 批次 ${p.length} 个</div><div class="actions"><button class="small" data-action="purchase" data-id="${a.courseId}">购买/赠送</button><button class="small secondary" data-action="transactions" data-id="${a.id}">查看流水</button></div></div>`}).join('')||empty('新增课程后会自动建立课时账户')}</div>`},

 const rules=ruleList(), start=new Date(); start.setHours(0,0,0,0); const end=new Date(start); end.setDate(end.getDate()+90);
 const existing=new Map(state.schedules.filter(x=>x.ruleId).map(x=>[x.ruleId+'_'+x.date,x])); const entries=[];
 for(const rule of rules){
  if(!state.courses.some(c=>c.id===rule.courseId&&!c.archived)) continue;
  const from=new Date((rule.startDate||dateISO(start))+'T00:00:00'); const to=rule.endDate?new Date(rule.endDate+'T00:00:00'):end; const first=from>start?from:start; const last=to<end?to:end;
  for(let d=new Date(first);d<=last;d.setDate(d.getDate()+1)){
   if(!(rule.weekdays||[]).includes(d.getDay())) continue;
   const date=dateISO(d), key=rule.id+'_'+date, old=existing.get(key);
   if(old){ if(old.status==='planned'&&!old.archived&&!old.manualOverride){old.time=rule.time;old.plannedHours=num(rule.plannedHours);old.location=rule.location||'';old.note=rule.note||'';old.updatedAt=new Date().toISOString();entries.push(['schedules',old]);} continue; }
   entries.push(['schedules',{id:'r_'+key,ruleId:rule.id,childId:rule.childId,courseId:rule.courseId,date,time:rule.time,plannedHours:num(rule.plannedHours),location:rule.location||'',note:rule.note||'',status:'planned',archived:false,createdAt:new Date().toISOString()}]);
  }
 }
 if(entries.length) await multiPut(entries);
}

 if(f.homeworkTitle?.trim())entries.push(['homework',{id:uid(),childId:s.childId,courseId:s.courseId,learningRecordId:learningId,title:f.homeworkTitle.trim(),deadline:f.deadline||null,status:'pending',content:'',createdAt:new Date().toISOString()}]);await multiPut(entries);await refresh()})}
else if(action==='setStatus'){let s=await getById('schedules',id);if(!s||s.status!=='planned')return; s.status=data.status;s.updatedAt=new Date().toISOString();await put('schedules',s);await refresh()}
else if(action==='addLearning'||action==='editLearning'){let old=id?await getById('learning',id):null;let childId=old?.childId||(currentChild!=='all'?currentChild:'');openModal(old?'编辑学习记录':'新增学习记录',`<div class="formgrid">${selectField('所属孩子','childId',childSelect(childId))}${selectField('所属课程','courseId',courseSelect(childId,old?.courseId||''))}${field('学习日期','date',old?.date||today(),'date',true)}<div class="field full"><label>课程内容</label><textarea name="content">${esc(old?.content||'')}</textarea></div><div class="field full"><label>老师反馈</label><textarea name="feedback">${esc(old?.feedback||'')}</textarea></div><div class="field full"><label>知识点及掌握情况</label><textarea name="points">${esc(old?.points||'')}</textarea></div><div class="field full"><label>阶段总结/家长备注</label><textarea name="summary">${esc(old?.summary||'')}</textarea></div></div>`,async f=>{let c=state.courses.find(x=>x.id===f.courseId);if(!c||c.childId!==f.childId)throw Error('孩子与课程不匹配');await addOrEdit('learning',old,f) ;await refresh()})}
else if(action==='addHomework'||action==='editHomework'){let old=id?await getById('homework',id):null;let childId=old?.childId||(currentChild!=='all'?currentChild:'');openModal(old?'编辑作业':'新增作业',`<div class="formgrid">${selectField('所属孩子','childId',childSelect(childId))}${selectField('所属课程','courseId',courseSelect(childId,old?.courseId||''))}${field('作业名称','title',old?.title||'','text',true)}${field('截止日期','deadline',old?.deadline||'','date')}<div class="field full"><label>作业内容</label><textarea name="content">${esc(old?.content||'')}</textarea></div></div>`,async f=>{let c=state.courses.find(x=>x.id===f.courseId);if(!c||c.childId!==f.childId)throw Error('孩子与课程不匹配');await addOrEdit('homework',old,{...f,status:old?.status||'pending'})})}
else if(action==='homeworkStatus'){let h=await getById('homework',id);h.status=data.status;h.updatedAt=new Date().toISOString();await put('homework',h);await refresh()}
else if(action==='adjust'){let childId=currentChild!=='all'?currentChild:'';openModal('人工调整课时',`<div class="formgrid">${selectField('所属孩子','childId',childSelect(childId))}${selectField('所属课程','courseId',courseSelect(childId))}${field('调整课时（增加填正数，扣减填负数）','change','','number',true,'step="0.5"') }<div class="field full"><label>调整原因（必填）</label><textarea name="reason" required></textarea></div></div>`,async f=>{let c=state.courses.find(x=>x.id===f.courseId),a=accountFor(f.courseId),change=num(f.change);if(!c||c.childId!==f.childId||!a)throw Error('请选择有效课程');if(!change)throw Error('调整课时不能为0');if(num(a.balance)+change<0)throw Error('调整后余额不能为负数');a.balance=num(a.balance)+change;if(change>0)a.totalPurchased=num(a.totalPurchased)+change;else a.totalConsumed=num(a.totalConsumed)-change;a.updatedAt=new Date().toISOString();let tx={id:uid(),childId:f.childId,courseId:f.courseId,accountId:a.id,type:'adjust',change,reason:f.reason,date:today(),createdAt:new Date().toISOString()};await multiPut([['accounts',a],['transactions',tx]]);await refresh()})}
else if(action==='transactions'){let tx=state.transactions.filter(x=>x.accountId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));openModal('课时流水',tx.length?`<table><thead><tr><th>日期</th><th>类型</th><th>变动</th><th>说明</th></tr></thead><tbody>${tx.map(t=>`<tr><td>${esc(t.date||'')}</td><td>${esc(t.type)}</td><td>${num(t.change)>0?'+':''}${num(t.change)}</td><td>${esc(t.reason||'')}</td></tr>`).join('')}</tbody></table>`:empty(),async()=>{}) ;$('#dlgForm button[type=submit]').classList.add('hidden')}
else if(action==='archive'){if(!confirm('确定归档？历史记录会保留，不会物理删除。'))return;let obj=await getById(data.type,id);if(obj){obj.archived=true;obj.updatedAt=new Date().toISOString();await put(data.type,obj);await refresh()}}
else if(action==='export'){let pack={app:DB,version:VERSION,exportedAt:new Date().toISOString(),data:{}};for(let s of stores)pack.data[s]=await all(s);let blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});download(blob,'家庭课程管理备份_'+today()+'.json')}
else if(action==='import'){$('#fileImport')?.remove();let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let file=input.files[0];if(!file)return;try{let p=JSON.parse(await file.text());if(p.app!==DB||!p.data||!stores.every(s=>Array.isArray(p.data[s])))throw Error('备份文件格式或项目标识不正确');if(!confirm('恢复将覆盖当前系统全部数据。建议先导出当前备份，确认继续？'))return;let tx=db.transaction(stores,'readwrite');stores.forEach(s=>{let os=tx.objectStore(s);os.clear();p.data[s].forEach(o=>os.put(o))});tx.oncomplete=async()=>{await refresh();toast('数据恢复成功')};tx.onerror=()=>toast('恢复失败：'+tx.error)}catch(e){alert('恢复失败：'+e.message)}};input.click()}
else if(action==='exportCSV'){let tx=state.transactions;let csv='日期,孩子,课程,类型,变动课时,说明\r\n'+tx.map(t=>[t.date,childName(t.childId),courseName(t.courseId),t.type,t.change,t.reason].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'课时流水_'+today()+'.csv')}
}catch(e){console.error(e);alert(e.message||'操作失败，请重试')}
}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function refresh(){await load();render();toast('保存成功')}
$('#dlgForm').addEventListener('submit',async e=>{e.preventDefault();if(!modalSave)return;let btn=$('#dlgForm button[type=submit]');if(btn.disabled)return;btn.disabled=true;try{await modalSave(formValues(e.currentTarget));closeModal()}catch(err){console.error('表单保存失败：',err);alert((err&&err.message)||'保存失败，请检查浏览器本地存储权限后重试')}finally{btn.disabled=false}});
$('#closeDlg').onclick=$('#cancelDlg').onclick=closeModal;
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
$('#bottomnav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
$('#childFilter').addEventListener('change',e=>{currentChild=e.target.value;render()});
$('#quickAdd').onclick=()=>openModal('快速新增',`<div class="list"><button data-q="child">新增孩子</button><button class="secondary" data-q="course">新增课程</button><button class="secondary" data-q="schedule">安排课程</button><button class="secondary" data-q="purchase">登记购买</button><button class="secondary" data-q="homework">新增作业</button></div>`,async()=>{}),$('#dlgBody').addEventListener('click',e=>{let b=e.target.closest('[data-q]');if(!b)return;let a={child:'addChild',course:'addCourse',schedule:'addSchedule',purchase:'purchase',homework:'addHomework'}[b.dataset.q];closeModal();handle(a)});
async function init(){try{db=await openDB();await load();await expireBatches();await load();await generateRecurringSchedules();await load();render()}catch(e){console.error(e);$('#view').innerHTML=`<div class="card"><h2>数据库初始化失败</h2><p>浏览器可能不支持 IndexedDB，或当前环境禁止本地存储。</p><p class="muted">${esc(e.message)}</p>请更换正常浏览器环境后重试。不要在未备份的情况下清除站点数据。</div>`}}
init();
})();
</script>
</body>
</html>
